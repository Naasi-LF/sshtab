[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "sshtab"
version = "0.1.0"
description = "Remote shell for AI agents: stateful windows over SSH, nothing to install on the server"
readme = "README.md"
requires-python = ">=3.9"

[project.scripts]
sshtab = "sshtab.cli:main"

[tool.setuptools]
packages = ["sshtab"]

[tool.setuptools.package-data]
sshtab = ["driver.sh"]
