[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "arc-remote"
version = "0.1.0"
description = "Remote shell for AI agents: stateful windows over SSH, nothing to install on the server"
readme = "DESIGN.md"
requires-python = ">=3.9"

[project.scripts]
arc = "arc.cli:main"

[tool.setuptools]
packages = ["arc"]

[tool.setuptools.package-data]
arc = ["driver.sh"]
